[versions]
agp = "8.13.2"
kotlin = "2.1.20"
compose-bom = "2026.06.01"
activity-compose = "1.13.0"
core-ktx = "1.18.0"
lifecycle = "2.10.0"
navigation-compose = "2.9.8"
coroutines = "1.9.0"
hilt = "2.58"
hilt-navigation = "1.3.0"
ksp = "2.1.20-1.0.32"
room = "2.8.4"
datastore = "1.2.1"
biometric = "1.1.0"
sshj = "0.40.0"
bouncycastle = "1.84"
termux-terminal = "0.118.3"
slf4j = "2.0.18"
kotlinx-serialization = "1.8.1"
documentfile = "1.1.0"
junit = "4.13.2"
androidx-test-junit = "1.3.0"
espresso = "3.7.0"
mockk = "1.13.13"
turbine = "1.2.1"
truth = "1.4.5"
ktlint-plugin = "12.1.2"
detekt = "1.23.8"

[libraries]
androidx-compose-bom                     = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-compose-ui                      = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics             = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling              = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview      = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation              = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3               = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-activity-compose                = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-navigation-compose              = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }
androidx-core-ktx                        = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-lifecycle-runtime-ktx           = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose     = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose       = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-process               = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-documentfile                    = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
kotlinx-coroutines-core                  = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android               = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json               = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
hilt-android                             = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler                            = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose                  = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation" }
androidx-room-runtime                    = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx                        = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler                   = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences           = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-biometric                       = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
bouncycastle-bcprov                      = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcpkix                      = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "bouncycastle" }
sshj                                     = { group = "com.hierynomus", name = "sshj", version.ref = "sshj" }
slf4j-api                                = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
termux-terminal-emulator                 = { group = "com.github.termux.termux-app", name = "terminal-emulator", version.ref = "termux-terminal" }
termux-terminal-view                     = { group = "com.github.termux.termux-app", name = "terminal-view", version.ref = "termux-terminal" }
junit                                    = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit                      = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }
androidx-espresso-core                   = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
mockk                                    = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
turbine                                  = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
truth                                    = { group = "com.google.truth", name = "truth", version.ref = "truth" }
kotlinx-coroutines-test                  = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

[bundles]
compose = ["androidx-compose-ui","androidx-compose-ui-graphics","androidx-compose-ui-tooling-preview","androidx-compose-foundation","androidx-compose-material3","androidx-compose-material-icons-extended","androidx-activity-compose","androidx-navigation-compose"]
lifecycle = ["androidx-lifecycle-runtime-ktx","androidx-lifecycle-viewmodel-compose","androidx-lifecycle-runtime-compose"]
coroutines = ["kotlinx-coroutines-core","kotlinx-coroutines-android"]
room = ["androidx-room-runtime","androidx-room-ktx"]
bouncycastle = ["bouncycastle-bcprov","bouncycastle-bcpkix"]
termux = ["termux-terminal-emulator","termux-terminal-view"]

[plugins]
android-application  = { id = "com.android.application", version.ref = "agp" }
android-library      = { id = "com.android.library", version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                 = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ktlint               = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
detekt               = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
