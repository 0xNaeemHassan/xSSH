name: CI

on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '17' }
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-36" "ndk;28.2.13676358"
      - run: chmod +x ./gradlew
      - name: Verify no telemetry
        run: ./gradlew verifyNoTelemetry --no-configuration-cache
      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck --continue
      - name: Static analysis (detekt)
        run: ./gradlew detekt --continue
      - name: Android lint
        run: ./gradlew :app:lintDebug
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug
      - name: Verify 16 KiB native compatibility
        run: python3 scripts/verify_native_alignment.py app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xSSH-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
