name: Release

on:
  push: { tags: [ 'v*' ] }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '17' }
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "ndk;28.2.13676358"
      - run: chmod +x ./gradlew

      - name: Build release and debug APKs
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          ORG_GRADLE_PROJECT_android.injected.signing.store.file: ${{ github.workspace }}/release.jks
          ORG_GRADLE_PROJECT_android.injected.signing.store.password: ${{ secrets.KEYSTORE_PASS }}
          ORG_GRADLE_PROJECT_android.injected.signing.key.alias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_android.injected.signing.key.password: ${{ secrets.KEY_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > release.jks
          fi
          ./gradlew verifyNoTelemetry testDebugUnitTest \
            :app:assembleRelease :app:assembleDebug \
            generateSbomLite generateLicenseReportLite --no-configuration-cache

      - name: Generate release checksums
        run: |
          mkdir -p release_out
          cp app/build/outputs/apk/release/*.apk release_out/xSSH-v0.1.0-release.apk
          cp app/build/outputs/apk/debug/*.apk release_out/xSSH-v0.1.0-debug.apk
          sha256sum release_out/*.apk > release_out/SHA256SUMS

      - name: Verify 16 KiB native compatibility
        run: python3 scripts/verify_native_alignment.py release_out/*.apk

      - name: Stage release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xssh-release-${{ github.ref_name }}
          path: |
            release_out/*.apk
            release_out/SHA256SUMS
            build/reports/sbom-lite.txt
            build/reports/licenses-lite.txt
          if-no-files-found: error
          retention-days: 14

      - name: Shred keystore
        if: always()
        run: shred -uz release.jks 2>/dev/null || rm -f release.jks

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xssh-release-${{ github.ref_name }}
          path: release-artifacts
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
